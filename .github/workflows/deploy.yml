name: Trigger n8n Deployment for fixbook-back-preprod

on:
  registry_package:
    types: [published]

concurrency:
  group: deploy-fixbook-back-preprod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.registry_package.package_version.container_metadata.tag.name != ''
    runs-on: self-hosted

    steps:
      - name: Send webhook to n8n
        run: |
          TAG="${{ github.event.registry_package.package_version.container_metadata.tag.name }}"
          REPOSITORY="ghcr.io/${{ github.repository }}-preprod"
          IMAGE="${REPOSITORY}:${TAG}"
          SERVICE="preprod"

          echo "Deployment image: $IMAGE"
          echo "Repository: $REPOSITORY"
          echo "Service: $SERVICE"
          echo "Tag: $TAG"

          curl -X POST http://localhost:5678/webhook/deploy-fixbook \
            -H "Content-Type: application/json" \
            -d "{\"service\":\"$SERVICE\",\"image\":\"$IMAGE\",\"repository\":\"$REPOSITORY\",\"tag\":\"$TAG\"}"

          echo "Webhook sent to n8n"
